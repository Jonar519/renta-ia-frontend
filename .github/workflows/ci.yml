name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test
      # "build" incluye el presupuesto de tamaño del bundle (scripts/check-bundle.mjs):
      # falla si el JS de entrada, algún chunk, el CSS o las fuentes crecen de más.
      - run: npm run build

      # Lighthouse CI sobre el build (perfil móvil simulado, 3 corridas) con
      # presupuestos: LCP < 2,5 s, CLS < 0,1, TBT < 200 ms (proxy de INP en
      # laboratorio). Empieza en modo ADVERTENCIA: no bloquea el merge.
      - name: Lighthouse CI (advertencias, no bloquea)
        continue-on-error: true
        run: npx --yes @lhci/cli@0.15.1 autorun

      - name: Reportes de Lighthouse
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse
          path: .lighthouseci
          if-no-files-found: ignore

  # Seguridad (Fase 4, docs/threat-model.md del backend):
  #  - npm audit de las dependencias de PRODUCCIÓN (lo que llega al navegador).
  #    Las de desarrollo (vite, vitest) se revisan a mano: ver docs/security.md.
  #  - gitleaks sobre todo el historial.
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: npm audit (dependencias de producción)
        run: npm audit --omit=dev --audit-level=moderate
      - name: gitleaks (secretos en el historial)
        run: docker run --rm -v "${{ github.workspace }}:/repo" zricethezav/gitleaks:v8.21.2 git /repo --redact --verbose
