<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Sin conexión · Renta IA</title>
    <style>
      /*
       * Página estática aparte (sin el CSS de la app): los colores son copia
       * literal de los primitivos de src/styles/tokens.css y su contraste se
       * mide en scripts/contrast.mjs (OFFLINE_PAIRS). Sigue el tema del sistema
       * operativo con CSS puro, como el resto de la app.
       */
      :root {
        color-scheme: light dark;
        --bg: #f4f6f8;
        --text: #1f2a38;
        --muted: #5b6472;
        --button-bg: #1f3b57;
        --button-text: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #16233a;
          --text: #ffffff;
          --muted: #c7d2e0;
          --button-bg: #ffffff;
          --button-text: #16233a;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--text);
        padding: 24px;
      }
      main {
        max-width: 420px;
        text-align: center;
      }
      h1 {
        font-family: Georgia, "Times New Roman", serif;
        font-weight: 600;
      }
      p {
        color: var(--muted);
        line-height: 1.55;
      }
      a {
        display: inline-block;
        margin-top: 16px;
        padding: 10px 18px;
        border-radius: 6px;
        background: var(--button-bg);
        color: var(--button-text);
        font-weight: 600;
        text-decoration: none;
      }
      a:focus-visible {
        outline: 3px solid #b9770e;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Sin conexión</h1>
      <p>
        No se pudo cargar Renta IA porque no hay conexión a internet y la aplicación todavía no estaba guardada en este
        dispositivo.
      </p>
      <p>Revisa tu conexión y vuelve a intentarlo.</p>
      <a href="/">Reintentar</a>
    </main>
  </body>
</html>
